# Optional isolated local PostgreSQL target. Does not touch INTAN databases.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: rental_trust
      POSTGRES_USER: rental_app
      POSTGRES_PASSWORD: ${RENTAL_DB_PASSWORD:?Set a local-only database password}
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - rental_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental_app -d rental_trust"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rental_pg:
